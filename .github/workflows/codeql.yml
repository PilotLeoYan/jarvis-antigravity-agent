name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly scheduled scan to detect new CVEs
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  # 'security-events: write' is REQUIRED to upload SARIF reports to the Security tab
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialize the CodeQL engine with the recommended security suite
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 'security-extended' o 'security-and-quality'
          queries: security-extended

      # Run the analysis and publish the SARIF results directly in GHAS
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
