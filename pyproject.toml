[project]
name = "jarvis-antigravity-agent"
version = "0.1.0"
description = "Autonomous AI engineering assistant powered by Google Antigravity CLI with Telegram bridge and offline speech-to-text"
readme = "README.md"
authors = [
    { name = "PilotLeoYan", email = "leofabyan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ctranslate2>=4.0.0",
    "faster-whisper>=1.0.0",
    "python-telegram-bot>=21.0",
]

[project.scripts]
jarvis-antigravity-agent = "jarvis_antigravity_agent:main"
jarvis-send-message = "jarvis_antigravity_agent.notifier:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]
extend-exclude = ["bridge"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
    '^bridge/',
]
